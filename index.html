<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>猿始服飾｜雲端庫存</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding-bottom:100px}
header{background:#111;color:#fff;padding:calc(22px + env(safe-area-inset-top)) 18px 20px}
.wrap{max-width:850px;margin:auto;padding:15px}
h1{font-size:24px;margin:0 0 5px}
.sub{font-size:13px;color:#bbb}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.user{font-size:12px;color:#ccc;overflow:hidden;text-overflow:ellipsis}
.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:700;font-size:14px}
.dark{background:#111;color:#fff}
.light{background:#eee;color:#111}
.danger{background:#fff0f0;color:#c33}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat,.card,.monthly,.authbox{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px #00000008}
.stat small,.muted{color:#777;font-size:12px}
.stat strong{display:block;margin-top:4px;font-size:18px}
.monthly{margin-bottom:12px}
.monthhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.monthgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.monthgrid div{background:#f6f6f6;border-radius:11px;padding:10px}
.monthgrid small{display:block;color:#777;font-size:11px}
.monthgrid strong{font-size:15px}
.tools{display:flex;gap:8px;margin-bottom:12px}
.input,.select{width:100%;border:1px solid #ddd;border-radius:11px;padding:12px;font-size:16px;background:#fff}
.card{margin-bottom:10px}
.top{display:flex;justify-content:space-between;gap:10px}
.brand{display:inline-block;background:#eee;border-radius:999px;padding:4px 8px;font-size:11px}
.name{font-weight:800;font-size:18px;margin:7px 0}
.meta{font-size:13px;color:#666;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:#f1f1f1;border-radius:8px;padding:5px 7px;font-size:12px}
.qty{text-align:right}
.qty strong{display:block;font-size:27px}
.actions{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin-top:12px;padding-top:12px;border-top:1px solid #eee}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:8;border:0;border-radius:999px;background:#111;color:#fff;padding:15px 19px;font-weight:800;box-shadow:0 6px 22px #0004}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:620px;border-radius:22px 22px 0 0;padding:19px;max-height:93vh;overflow:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:800;margin:0 0 5px}
.field{margin-bottom:10px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid #ddd;background:#f2f2f2;border-radius:9px;padding:9px 11px}
.pick button.on{background:#111;color:#fff;border-color:#111}
.variant{display:grid;grid-template-columns:95px 1fr;gap:8px;align-items:center;margin:6px 0}
.variant input{border:1px solid #ddd;border-radius:9px;padding:9px;width:100%}
.sheetactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.authwrap{min-height:70vh;display:grid;place-items:center}
.authbox{width:100%;max-width:430px}
.authbox h2{margin-top:0}
.authbox .input{margin-bottom:9px}
.authactions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hidden{display:none!important}
.empty{text-align:center;background:#fff;border-radius:16px;padding:40px;color:#888}
.sale{font-size:12px;padding:9px 0;border-bottom:1px solid #eee}
.status{font-size:12px;margin-top:8px;color:#666}

@media(max-width:560px){
.stats{grid-template-columns:1fr 1fr}
.stats .stat:last-child{grid-column:1/-1}
.monthgrid{grid-template-columns:1fr 1fr}
.tools{flex-direction:column}
.grid{grid-template-columns:1fr}
.full{grid-column:auto}
}
</style>
</head>

<body>

<header>
<div style="max-width:850px;margin:auto">
<h1>猿始服飾｜庫存管理</h1>
<div class="sub">Firebase 雲端同步版</div>

<div id="userBar" class="bar hidden">
<div id="userEmail" class="user"></div>
<button class="btn light" id="logoutBtn">登出</button>
</div>

</div>
</header>

<main class="wrap">

<section id="authView" class="authwrap">
<div class="authbox">
<h2>老闆登入</h2>

<input id="email" class="input" type="email" placeholder="Email">
<input id="password" class="input" type="password" placeholder="密碼（至少 6 碼）">

<div class="authactions">
<button class="btn dark" id="loginBtn">登入</button>
<button class="btn light" id="registerBtn">註冊</button>
</div>

<div id="authStatus" class="status">登入後即可讀取共用庫存。</div>
</div>
</section>

<section id="appView" class="hidden">

<div class="stats">
<div class="stat">
<small>庫存總件數</small>
<strong id="totalQty">0</strong>
</div>

<div class="stat">
<small>庫存總成本</small>
<strong id="totalCost">$0</strong>
</div>

<div class="stat">
<small>庫存售價總值</small>
<strong id="totalRetail">$0</strong>
</div>
</div>

<div class="monthly">

<div class="monthhead">
<div>
<small class="muted">銷售統計</small>
<h3 id="monthTitle" style="margin:2px 0">本月統計</h3>
</div>

<input id="monthPicker" class="select" type="month" style="width:auto">
</div>

<div class="monthgrid">
<div><small>售出</small><strong id="monthUnits">0 件</strong></div>
<div><small>營業額</small><strong id="monthRevenue">$0</strong></div>
<div><small>商品成本</small><strong id="monthCost">$0</strong></div>
<div><small>毛利</small><strong id="monthProfit">$0</strong></div>
</div>

<details style="margin-top:10px">
<summary>查看銷售明細</summary>
<div id="salesList"></div>
</details>

</div>

<div class="tools">

<input id="search" class="input" placeholder="搜尋品牌、商品、序號、尺寸、顏色">

<select id="brandFilter" class="select">
<option value="">全部品牌</option>
</select>

</div>

<section id="list"></section>

</section>
</main>

<button id="fab" class="fab hidden">＋ 新增商品</button>

<div id="modal" class="modal">

<div class="sheet">

<h2 id="modalTitle">新增商品</h2>

<div class="grid">

<div class="field">
<label>商品序號</label>
<input id="sku" class="input">
</div>

<!-- 品牌改成固定選項 -->
<div class="field">
<label>品牌</label>
<select id="brand" class="select">
<option value="">請選擇品牌</option>
<option value="AAPE">AAPE</option>
<option value="迪桑特">迪桑特</option>
<option value="ON">ON</option>
<option value="BAPE">BAPE</option>
</select>
</div>

<div class="field full">
<label>商品名稱</label>
<input id="productName" class="input">
</div>

<div class="field full">
<label>商品類型</label>

<select id="productType" class="select">
<option value="clothes">衣服</option>
<option value="shoes">鞋子</option>
</select>

</div>

<div class="field full">
<label>尺寸（可複選）</label>
<div id="sizePick" class="pick"></div>
</div>

<div class="field full">

<label>顏色（可複選）</label>

<div id="colorPick" class="pick"></div>

<div style="display:flex;gap:6px;margin-top:7px">

<input id="customColor" class="input" placeholder="其他顏色">

<button id="addColorBtn" class="btn light">加入</button>

</div>
</div>

<div class="field full">

<label>顏色 × 尺寸庫存</label>

<div id="variants"></div>

</div>

<div class="field">
<label>進貨成本</label>
<input id="cost" class="input" type="number" min="0">
</div>

<div class="field">
<label>售價</label>
<input id="price" class="input" type="number" min="0">
</div>

</div>

<div class="sheetactions">

<button id="cancelBtn" class="btn light">取消</button>

<button id="saveBtn" class="btn dark">儲存</button>

</div>

<button id="deleteBtn" class="btn danger hidden" style="width:100%;margin-top:8px">
刪除商品
</button>

</div>
</div>

<script type="module">

import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';

import {
getAuth,
onAuthStateChanged,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
signOut
} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';

import {
getFirestore,
collection,
doc,
setDoc,
deleteDoc,
addDoc,
onSnapshot,
query,
orderBy,
serverTimestamp,
runTransaction
} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

const firebaseConfig={
apiKey:'AIzaSyDDHmYF9LNDBSW_aSq91QTYU7_rQNPkU-c',
authDomain:'yuanshi-inventory.firebaseapp.com',
projectId:'yuanshi-inventory',
storageBucket:'yuanshi-inventory.firebasestorage.app',
messagingSenderId:'107227719678',
appId:'1:107227719678:web:aad239f88e57fb4a4d42af'
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);

const money=n=>'$'+Number(n||0).toLocaleString('zh-TW');

let products=[];
let sales=[];
let editingId=null;
let selectedSizes=[];
let selectedColors=[];
let variantStock={};
let unsubP=null;
let unsubS=null;

/* 衣服新增 XS */
const sizes={
clothes:['XS','S','M','L','XL','2XL'],
shoes:[
'23','23.5','24','24.5',
'25','25.5','26','26.5',
'27','27.5','28','28.5','29'
]
};

const baseColors=[
'黑','白','灰','藍','紅','綠','米','卡其'
];

const esc=s=>String(s??'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m])
);

function msg(e){
return (e?.code||'').replace('auth/','')||e?.message||String(e)
}

$('loginBtn').onclick=async()=>{

try{

await signInWithEmailAndPassword(
auth,
$('email').value.trim(),
$('password').value
);

$('authStatus').textContent='登入成功';

}catch(e){

$('authStatus').textContent='登入失敗：'+msg(e);

}

};

$('registerBtn').onclick=async()=>{

if(!confirm('確定要用這組 Email 註冊新老闆帳號？'))return;

try{

await createUserWithEmailAndPassword(
auth,
$('email').value.trim(),
$('password').value
);

$('authStatus').textContent='註冊成功';

}catch(e){

$('authStatus').textContent='註冊失敗：'+msg(e);

}

};

$('logoutBtn').onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{

if(unsubP)unsubP();
if(unsubS)unsubS();

if(user){

$('authView').classList.add('hidden');
$('appView').classList.remove('hidden');
$('fab').classList.remove('hidden');
$('userBar').classList.remove('hidden');

$('userEmail').textContent=user.email;

unsubP=onSnapshot(
collection(db,'products'),
s=>{
products=s.docs.map(d=>({
id:d.id,
...d.data()
}));

render();
}
);

unsubS=onSnapshot(
query(
collection(db,'sales'),
orderBy('createdAt','asc')
),
s=>{
sales=s.docs.map(d=>({
id:d.id,
...d.data()
}));

renderMonthly();
}
);

}else{

$('authView').classList.remove('hidden');
$('appView').classList.add('hidden');
$('fab').classList.add('hidden');
$('userBar').classList.add('hidden');

products=[];
sales=[];

}

});

function render(){

let q=$('search').value.trim().toLowerCase();

let bf=$('brandFilter').value;

let brands=[
...new Set(
products.map(p=>p.brand).filter(Boolean)
)
].sort();

$('brandFilter').innerHTML=
'<option value="">全部品牌</option>'+
brands.map(
b=>`<option>${esc(b)}</option>`
).join('');

if(brands.includes(bf))
$('brandFilter').value=bf;

let rows=products.filter(p=>{

let t=[
p.sku,
p.brand,
p.name,
...(p.colors||[]),
...Object.keys(p.variantStock||{})
].join(' ').toLowerCase();

return(
(!q||t.includes(q)) &&
(!bf||p.brand===bf)
);

});

$('totalQty').textContent=
products.reduce(
(a,p)=>a+Number(p.qty||0),
0
);

$('totalCost').textContent=
money(
products.reduce(
(a,p)=>a+Number(p.cost||0)*Number(p.qty||0),
0
)
);

$('totalRetail').textContent=
money(
products.reduce(
(a,p)=>a+Number(p.price||0)*Number(p.qty||0),
0
)
);

$('list').innerHTML=
rows.length
?
rows.map(p=>`

<article class="card">

<div class="top">

<div>

<span class="brand">
${esc(p.brand||'未分類')}
</span>

<div class="name">
${esc(p.name)}
</div>

<div class="meta">

${p.sku?'序號：'+esc(p.sku)+'<br>':''}

成本 ${money(p.cost)}
・
售價 ${money(p.price)}

<div class="chips">

${Object.entries(p.variantStock||{})

.filter(([,v])=>Number(v)>0)

.map(([k,v])=>{

let[c,s]=k.split('||');

return `
<span class="chip">
${esc(c)} ${esc(s)}：${v}件
</span>
`;

}).join('')}

</div>

</div>

</div>

<div class="qty">

<span class="muted">
目前庫存
</span>

<strong>
${p.qty||0}
</strong>

</div>

</div>

<div class="actions">

<button
class="btn dark"
data-act="out"
data-id="${p.id}">
− 售出
</button>

<button
class="btn light"
data-act="in"
data-id="${p.id}">
＋ 進貨
</button>

<button
class="btn light"
data-act="edit"
data-id="${p.id}">
編輯
</button>

</div>

</article>

`).join('')

:

'<div class="empty">還沒有商品</div>';

document
.querySelectorAll('[data-act]')
.forEach(
b=>b.onclick=()=>action(
b.dataset.id,
b.dataset.act
)
);

}

async function action(id,act){

if(act==='edit')
return openModal(id);

let p=products.find(
x=>x.id===id
);

let keys=
Object.keys(
p.variantStock||{}
);

if(!keys.length)
return alert(
'請先編輯商品設定規格'
);

let label=prompt(

'輸入規格，例如「黑 M」：\n'+

keys.map(k=>{

let[c,s]=k.split('||');

return `${c} ${s}（${p.variantStock[k]||0}件）`;

}).join('、')

);

if(!label)return;

let key=keys.find(
k=>
k.split('||')
.join(' ')
.toLowerCase()
===
label.trim().toLowerCase()
);

if(!key)
return alert(
'找不到這個規格'
);

let delta=
act==='out'?-1:1;

let ref=
doc(db,'products',id);

let saleData=null;

try{

await runTransaction(
db,
async tx=>{

let snap=
await tx.get(ref);

let d=snap.data();

let cur=
Number(
d.variantStock?.[key]||0
);

if(delta<0&&cur<=0)
throw new Error(
'此規格沒有庫存'
);

let vs={
...(d.variantStock||{})
};

vs[key]=cur+delta;

let qty=
Object.values(vs)
.reduce(
(a,n)=>a+Number(n||0),
0
);

tx.update(
ref,
{
variantStock:vs,
qty,
updatedAt:serverTimestamp()
}
);

if(delta<0){

let[c,s]=key.split('||');

saleData={
productId:id,
sku:d.sku||'',
brand:d.brand||'',
name:d.name||'',
color:c,
size:s,
qty:1,
price:Number(d.price||0),
cost:Number(d.cost||0),
date:new Date()
.toISOString()
.slice(0,10),
createdAt:serverTimestamp(),
by:auth.currentUser.email
};

}

}
);

if(saleData)
await addDoc(
collection(db,'sales'),
saleData
);

}catch(e){

alert(e.message);

}

}

function renderMonthly(){

let ym=
$('monthPicker').value;

if(!ym)return;

let[y,m]=ym.split('-');

let r=sales.filter(
s=>
String(s.date||'')
.slice(0,7)
===
ym
);

let u=r.reduce(
(a,s)=>a+Number(s.qty||1),
0
);

let rev=r.reduce(
(a,s)=>a+Number(s.price||0)*Number(s.qty||1),
0
);

let c=r.reduce(
(a,s)=>a+Number(s.cost||0)*Number(s.qty||1),
0
);

$('monthTitle').textContent=
`${+y}年${+m}月`;

$('monthUnits').textContent=
u+' 件';

$('monthRevenue').textContent=
money(rev);

$('monthCost').textContent=
money(c);

$('monthProfit').textContent=
money(rev-c);

$('salesList').innerHTML=
r.length
?
r.slice()
.reverse()
.map(s=>`

<div class="sale">

<b>
${esc(s.brand)} ${esc(s.name)}
</b>

　${money(s.price)}

<br>

<span class="muted">

${esc(s.date)}
・
${esc(s.color)} ${esc(s.size)}
・
${esc(s.by||'')}

</span>

</div>

`).join('')

:

'<div class="muted" style="padding:12px 0">這個月份沒有銷售紀錄</div>';

}

function openModal(id=null){

editingId=id;

let p=
id
?
products.find(x=>x.id===id)
:
null;

$('modalTitle').textContent=
p?'編輯商品':'新增商品';

$('sku').value=
p?.sku||'';

$('brand').value=
p?.brand||'';

$('productName').value=
p?.name||'';

$('productType').value=
p?.productType||'clothes';

selectedColors=[
...(p?.colors||[])
];

selectedSizes=[
...new Set(
Object.keys(
p?.variantStock||{}
)
.map(
k=>k.split('||')[1]
)
)
];

variantStock={
...(p?.variantStock||{})
};

$('cost').value=
p?.cost??'';

$('price').value=
p?.price??'';

$('deleteBtn')
.classList
.toggle(
'hidden',
!p
);

renderPicks();

$('modal')
.classList
.add('show');

}

function renderPicks(){

let opts=
sizes[
$('productType').value
];

$('sizePick').innerHTML=
opts.map(
s=>`
<button
class="${selectedSizes.includes(s)?'on':''}"
data-size="${s}">
${s}
</button>
`
).join('');

let cs=[
...new Set(
[
...baseColors,
...selectedColors
]
)
];

$('colorPick').innerHTML=
cs.map(
c=>`
<button
class="${selectedColors.includes(c)?'on':''}"
data-color="${esc(c)}">
${esc(c)}
</button>
`
).join('');

document
.querySelectorAll('[data-size]')
.forEach(
b=>b.onclick=()=>{

let s=b.dataset.size;

selectedSizes=
selectedSizes.includes(s)
?
selectedSizes.filter(x=>x!==s)
:
[...selectedSizes,s];

renderPicks();

}
);

document
.querySelectorAll('[data-color]')
.forEach(
b=>b.onclick=()=>{

let c=b.dataset.color;

selectedColors=
selectedColors.includes(c)
?
selectedColors.filter(x=>x!==c)
:
[...selectedColors,c];

renderPicks();

}
);

renderVariants();

}

function renderVariants(){

$('variants').innerHTML=
selectedColors.length&&selectedSizes.length

?

selectedColors.flatMap(
c=>
selectedSizes.map(
s=>{

let k=c+'||'+s;

return `

<div class="variant">

<b>
${esc(c)} ${esc(s)}
</b>

<input
type="number"
min="0"
value="${Number(variantStock[k]||0)}"
data-v="${esc(k)}">

</div>

`;

}
)
).join('')

:

'<div class="muted">先選顏色與尺寸</div>';

document
.querySelectorAll('[data-v]')
.forEach(
i=>
i.oninput=()=>
variantStock[i.dataset.v]=
Math.max(
0,
Number(i.value||0)
)
);

}

$('productType').onchange=()=>{

selectedSizes=[];
variantStock={};

renderPicks();

};

$('addColorBtn').onclick=()=>{

let c=
$('customColor')
.value
.trim();

if(
c &&
!selectedColors.includes(c)
)
selectedColors.push(c);

$('customColor').value='';

renderPicks();

};

$('fab').onclick=
()=>openModal();

$('cancelBtn').onclick=
()=>
$('modal')
.classList
.remove('show');

$('modal').onclick=e=>{

if(e.target===$('modal'))

$('modal')
.classList
.remove('show');

};

$('saveBtn').onclick=async()=>{

let name=
$('productName')
.value
.trim();

let brand=
$('brand').value;

if(!brand)
return alert('請選擇品牌');

if(
!name ||
!selectedSizes.length ||
!selectedColors.length
)
return alert(
'請填商品名稱並選尺寸、顏色'
);

let clean={};

selectedColors.forEach(
c=>
selectedSizes.forEach(
s=>
clean[c+'||'+s]=
Number(
variantStock[c+'||'+s]||0
)
)
);

let data={

sku:$('sku').value.trim(),

brand:brand,

name,

productType:
$('productType').value,

colors:selectedColors,

variantStock:clean,

qty:
Object.values(clean)
.reduce(
(a,n)=>a+n,
0
),

cost:
Math.max(
0,
Number(
$('cost').value||0
)
),

price:
Math.max(
0,
Number(
$('price').value||0
)
),

updatedAt:
serverTimestamp(),

updatedBy:
auth.currentUser.email

};

try{

if(editingId)

await setDoc(
doc(
db,
'products',
editingId
),
data,
{merge:true}
);

else

await addDoc(
collection(
db,
'products'
),
{
...data,
createdAt:
serverTimestamp(),
createdBy:
auth.currentUser.email
}
);

$('modal')
.classList
.remove('show');

}catch(e){

alert(e.message);

}

};

$('deleteBtn').onclick=
async()=>{

if(
editingId &&
confirm(
'確定刪除這個商品？'
)
){

await deleteDoc(
doc(
db,
'products',
editingId
)
);

$('modal')
.classList
.remove('show');

}

};

$('search').oninput=
render;

$('brandFilter').onchange=
render;

$('monthPicker').onchange=
renderMonthly;

let now=new Date();

$('monthPicker').value=
`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

</script>

</body>
</html>
