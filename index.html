<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>猿始服飾｜庫存管理</title>
<style>
:root{
  --bg:#f4f4f4;--card:#fff;--text:#151515;--muted:#777;--line:#e9e9e9;
  --dark:#111;--danger:#d9363e;--warn:#fff3d6;--warntext:#9a6500;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;
  padding-bottom:110px;
}
header{
  background:#111;color:white;padding:calc(22px + env(safe-area-inset-top)) 18px 22px;
}
.head{max-width:850px;margin:auto}
header h1{font-size:25px;margin:0 0 6px}
header p{font-size:14px;color:#bbb;margin:0}
.wrap{max-width:850px;margin:auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.stat{background:white;border-radius:15px;padding:14px 11px;box-shadow:0 2px 10px #00000008}
.stat small{display:block;color:#777;font-size:12px;margin-bottom:5px}
.stat strong{font-size:18px}
.tools{display:flex;gap:9px;margin-bottom:14px}
.search{flex:1;background:white;border:1px solid #e5e5e5;border-radius:14px;padding:13px 14px;font-size:16px;outline:none}
select.filter{border:1px solid #e5e5e5;background:white;border-radius:14px;padding:0 10px;font-size:14px;max-width:120px}
.card{background:white;border-radius:17px;padding:16px;margin-bottom:11px;box-shadow:0 2px 12px #00000008}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.name{font-size:18px;font-weight:750;margin-bottom:4px}
.brand{display:inline-block;font-size:12px;background:#efefef;padding:4px 8px;border-radius:999px;margin-bottom:8px}
.meta{font-size:14px;color:#666;line-height:1.7}
.stock{text-align:right;min-width:70px}
.stock span{display:block;color:#777;font-size:12px}
.stock strong{font-size:26px}
.low{background:var(--warn);color:var(--warntext);padding:4px 7px;border-radius:8px;font-size:11px;font-weight:700;display:inline-block;margin-top:4px}
.actions{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
button{border:0;border-radius:11px;padding:11px 12px;font-size:15px;font-weight:700;cursor:pointer}
.out{background:#111;color:white}
.in{background:#ededed;color:#111}
.edit{background:#f6f6f6;color:#555;padding-left:14px;padding-right:14px}
.empty{text-align:center;color:#888;background:white;border-radius:17px;padding:45px 20px}
.fab{
  position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));
  background:#111;color:white;border-radius:999px;padding:15px 20px;
  box-shadow:0 7px 25px #0004;z-index:10
}
.modal{
  display:none;position:fixed;inset:0;background:#0008;z-index:20;
  align-items:flex-end;justify-content:center
}
.modal.show{display:flex}
.sheet{
  width:100%;max-width:600px;background:white;border-radius:22px 22px 0 0;
  max-height:92vh;overflow:auto;padding:20px 18px calc(22px + env(safe-area-inset-bottom))
}
.sheet h2{margin:0 0 15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:11px}
.field.full{grid-column:1/-1}
label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}
input.form,select.form{
  width:100%;border:1px solid #ddd;border-radius:11px;padding:12px;font-size:16px;outline:none;background:white
}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}
.cancel{background:#eee}
.save{background:#111;color:white}
.delete{background:#fff0f0;color:var(--danger);width:100%;margin-top:9px}
.note{font-size:12px;color:#888;margin:10px 2px 0}
@media(max-width:520px){
  .size-grid{grid-template-columns:repeat(4,1fr)}
  .stats{grid-template-columns:1fr 1fr}
  .stats .stat:last-child{grid-column:1/-1}
  .tools{flex-direction:column}
  select.filter{max-width:none;padding:12px}
}

.size-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:10px}
.size-btn{background:#f1f1f1;color:#222;border:1px solid #ddd;padding:11px 4px}
.size-btn.selected{background:#111;color:#fff;border-color:#111}
.size-row{display:grid;grid-template-columns:60px 1fr;gap:10px;align-items:center;margin-top:7px}
.size-row b{font-size:14px}
.size-row input{width:100%;border:1px solid #ddd;border-radius:10px;padding:10px;font-size:16px}
.size-stock{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.size-chip{background:#f2f2f2;border-radius:8px;padding:5px 8px;font-size:12px}

.monthly{background:#fff;border-radius:17px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #00000008}
.monthly-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.monthly-head small{color:#777}.monthly-head h2{margin:2px 0 0;font-size:19px}
.monthly-head input{border:1px solid #ddd;border-radius:10px;padding:8px;background:#fff;font-size:14px}
.month-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.month-grid div{background:#f6f6f6;border-radius:12px;padding:11px}
.month-grid small{display:block;color:#777;font-size:12px;margin-bottom:4px}
.month-grid strong{font-size:17px}
details{margin-top:12px;border-top:1px solid #eee;padding-top:11px}
summary{font-weight:700;cursor:pointer}
.sale-row{padding:10px 2px;border-bottom:1px solid #eee;font-size:13px;line-height:1.55}
.sale-row:last-child{border-bottom:0}.sale-row .sale-top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.sale-row .sale-sub{color:#777}
.no-sales{padding:16px 0;color:#888;text-align:center;font-size:13px}
.color-grid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.color-btn{background:#f1f1f1;color:#222;border:1px solid #ddd;border-radius:999px;padding:9px 13px}
.color-btn.selected{background:#111;color:#fff;border-color:#111}
.custom-color{display:grid;grid-template-columns:1fr auto;gap:7px}.custom-color button{background:#eee;color:#111}
</style>
</head>
<body>
<header>
  <div class="head">
    <h1>猿始服飾｜庫存管理</h1>
    <p>快速版・商品庫存即時記錄</p>
  </div>
</header>

<main class="wrap">
  <section class="stats">
    <div class="stat"><small>庫存總件數</small><strong id="totalQty">0</strong></div>
    <div class="stat"><small>庫存總成本</small><strong id="totalCost">$0</strong></div>
    <div class="stat"><small>庫存售價總值</small><strong id="totalRetail">$0</strong></div>
  </section>

  <section class="monthly">
    <div class="monthly-head">
      <div>
        <small>銷售統計</small>
        <h2 id="monthTitle">本月統計</h2>
      </div>
      <input id="monthPicker" type="month" onchange="renderMonthlyStats()">
    </div>
    <div class="month-grid">
      <div><small>售出</small><strong id="monthUnits">0 件</strong></div>
      <div><small>營業額</small><strong id="monthRevenue">$0</strong></div>
      <div><small>商品成本</small><strong id="monthCost">$0</strong></div>
      <div><small>毛利</small><strong id="monthProfit">$0</strong></div>
    </div>
    <details>
      <summary>查看本月銷售明細</summary>
      <div id="salesList" class="sales-list"></div>
    </details>
  </section>

  <div class="tools">
    <input id="search" class="search" placeholder="搜尋品牌、商品、尺寸、顏色">
    <select id="brandFilter" class="filter">
      <option value="">全部品牌</option>
    </select>
  </div>

  <section id="list"></section>
</main>

<button class="fab" onclick="openModal()">＋ 新增商品</button>

<div id="modal" class="modal" onclick="backdropClose(event)">
  <div class="sheet">
    <h2 id="modalTitle">新增商品</h2>
    <div class="grid">
      <div class="field">
        <label>商品序號</label>
        <input id="sku" class="form" placeholder="例如 AAPE-001">
      </div>
      <div class="field">
        <label>品牌</label>
        <input id="brand" class="form" placeholder="例如 AAPE">
      </div>
      <div class="field">
        <label>商品名稱</label>
        <input id="productName" class="form" placeholder="例如 黑色短T">
      </div>
      <div class="field full">
        <label>商品類型</label>
        <select id="productType" class="form" onchange="changeProductType()">
          <option value="clothes">衣服</option>
          <option value="shoes">鞋子</option>
        </select>
      </div>
      <div class="field full">
        <label id="sizeLabel">衣服尺寸與各尺寸庫存（可複選）</label>
        <div class="size-grid" id="sizeGrid"></div>
        <div id="sizeQtys"></div>
      </div>
      <div class="field full">
        <label>顏色（可複選）</label>
        <div id="colorGrid" class="color-grid"></div>
        <div class="custom-color"><input id="customColor" class="form" placeholder="其他顏色"><button type="button" onclick="addColor()">＋加入</button></div>
      </div>
      <div class="field">
        <label>進貨成本</label>
        <input id="cost" class="form" inputmode="numeric" type="number" min="0" placeholder="0">
      </div>
      <div class="field">
        <label>售價</label>
        <input id="price" class="form" inputmode="numeric" type="number" min="0" placeholder="0">
      </div>

    </div>
    <div class="sheet-actions">
      <button class="cancel" onclick="closeModal()">取消</button>
      <button class="save" onclick="saveProduct()">儲存商品</button>
    </div>
    <button id="deleteBtn" class="delete" style="display:none" onclick="deleteProduct()">刪除這個商品</button>
    <p class="note">目前資料儲存在這台裝置的瀏覽器中。之後可升級 Firebase，讓多支手機同步。</p>
  </div>
</div>

<script>
const KEY = 'yuanshi_inventory_v1';
const SALES_KEY = 'yuanshi_sales_v1';
let products = JSON.parse(localStorage.getItem(KEY) || '[]');
let sales = JSON.parse(localStorage.getItem(SALES_KEY) || '[]');
let editingId = null;
let selectedSizes = {};
let selectedColors = [];
const COLOR_OPTIONS=['黑','白','灰','藍','紅','綠','米','卡其'];
let currentProductType = 'clothes';
const SIZE_OPTIONS = {
  clothes:['S','M','L','XL','2XL'],
  shoes:['23','23.5','24','24.5','25','25.5','26','26.5','27','27.5','28','28.5','29']
};

const $ = id => document.getElementById(id);
const money = n => '$' + Number(n || 0).toLocaleString('zh-TW');

function persist(){
  localStorage.setItem(KEY, JSON.stringify(products));
  render();
}
function esc(s=''){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function render(){
  const q = $('search').value.trim().toLowerCase();
  const bf = $('brandFilter').value;

  const brands = [...new Set(products.map(p=>p.brand).filter(Boolean))].sort();
  const old = $('brandFilter').value;
  $('brandFilter').innerHTML = '<option value="">全部品牌</option>' +
    brands.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('');
  if(brands.includes(old)) $('brandFilter').value = old;

  const filtered = products.filter(p=>{
    const text = [p.sku,p.brand,p.name,Object.keys(p.sizes||{}).join(' '),(p.colors||[p.color||'']).join(' ')].join(' ').toLowerCase();
    return (!q || text.includes(q)) && (!bf || p.brand === bf);
  });

  $('totalQty').textContent = products.reduce((a,p)=>a+Number(p.qty||0),0).toLocaleString();
  $('totalCost').textContent = money(products.reduce((a,p)=>a+Number(p.cost||0)*Number(p.qty||0),0));
  $('totalRetail').textContent = money(products.reduce((a,p)=>a+Number(p.price||0)*Number(p.qty||0),0));

  renderMonthlyStats();
  if(!filtered.length){
    $('list').innerHTML = `<div class="empty">${products.length ? '找不到符合的商品' : '還沒有商品<br><br>按右下角「＋ 新增商品」開始記庫存'}</div>`;
    return;
  }

  $('list').innerHTML = filtered.map(p=>`
    <article class="card">
      <div class="top">
        <div>
          <div class="brand">${esc(p.brand || '未分類')}</div>
          <div class="name">${esc(p.name)}</div>
          ${p.sku ? `<div class="meta">序號：${esc(p.sku)}</div>` : ''}
          <div class="meta">
            ${Object.keys(p.sizes||{}).length ? `尺寸：${Object.keys(p.sizes).map(esc).join(' / ')}　` : ''}${(p.colors||[]).length ? `顏色：${p.colors.map(esc).join(' / ')}` : (p.color ? `顏色：${esc(p.color)}` : '')}<br>
            <div class="size-stock">${Object.entries(p.sizes||{}).map(([s,q])=>`<span class="size-chip">${esc(s)}：${Number(q)}件</span>`).join('')}</div>
            成本 ${money(p.cost)} ・ 售價 ${money(p.price)}
          </div>
        </div>
        <div class="stock">
          <span>目前庫存</span>
          <strong>${Number(p.qty||0)}</strong>
          ${Number(p.qty||0)<=1 ? '<div class="low">低庫存</div>' : ''}
        </div>
      </div>
      <div class="actions">
        <button class="out" onclick="changeSizeQty('${p.id}',-1)">− 售出</button>
        <button class="in" onclick="changeSizeQty('${p.id}',1)">＋ 進貨</button>
        <button class="edit" onclick="openModal('${p.id}')">編輯</button>
      </div>
    </article>
  `).join('');
}


function changeProductType(){
  const next = $('productType').value;
  if(next !== currentProductType){
    currentProductType = next;
    selectedSizes = {};
  }
  renderSizeEditor();
}
function renderColors(){
  const all=[...new Set([...COLOR_OPTIONS,...selectedColors])];
  $('colorGrid').innerHTML=all.map(c=>`<button type="button" class="color-btn ${selectedColors.includes(c)?'selected':''}" onclick="toggleColor('${c}')">${esc(c)}</button>`).join('');
}
function toggleColor(c){
  selectedColors=selectedColors.includes(c)?selectedColors.filter(x=>x!==c):[...selectedColors,c];
  renderColors();
}
function addColor(){
  const c=$('customColor').value.trim(); if(!c)return;
  if(!selectedColors.includes(c))selectedColors.push(c);
  $('customColor').value=''; renderColors();
}
function toggleSize(size){
  if(selectedSizes[size] !== undefined) delete selectedSizes[size];
  else selectedSizes[size] = 0;
  renderSizeEditor();
}
function renderSizeEditor(){
  const opts = SIZE_OPTIONS[currentProductType];
  $('sizeLabel').textContent = (currentProductType === 'shoes' ? '鞋子尺寸' : '衣服尺寸') + '與各尺寸庫存（可複選）';
  $('sizeGrid').innerHTML = opts.map(s=>`<button type="button" class="size-btn ${selectedSizes[s] !== undefined ? 'selected':''}" data-size="${s}" onclick="toggleSize('${s}')">${s}</button>`).join('');
  $('sizeQtys').innerHTML = Object.keys(selectedSizes).map(s=>`
    <div class="size-row"><b>${s}</b>
      <input type="number" min="0" inputmode="numeric" value="${Number(selectedSizes[s]||0)}"
        oninput="selectedSizes['${s}']=Math.max(0,Number(this.value||0))" placeholder="庫存數量">
    </div>`).join('');
}
function recalcQty(p){
  p.qty = Object.values(p.sizes||{}).reduce((a,n)=>a+Number(n||0),0);
}

function renderMonthlyStats(){
  const ym = $('monthPicker')?.value || '';
  if(!ym) return;
  const [y,m] = ym.split('-');
  $('monthTitle').textContent = `${Number(y)}年${Number(m)}月`;
  const rows = sales.filter(s => String(s.date||'').slice(0,7) === ym);
  const units = rows.reduce((a,s)=>a+Number(s.qty||1),0);
  const revenue = rows.reduce((a,s)=>a+Number(s.price||0)*Number(s.qty||1),0);
  const cost = rows.reduce((a,s)=>a+Number(s.cost||0)*Number(s.qty||1),0);
  $('monthUnits').textContent = units.toLocaleString() + ' 件';
  $('monthRevenue').textContent = money(revenue);
  $('monthCost').textContent = money(cost);
  $('monthProfit').textContent = money(revenue-cost);
  if(!rows.length){
    $('salesList').innerHTML = '<div class="no-sales">這個月份還沒有銷售紀錄</div>';
    return;
  }
  $('salesList').innerHTML = rows.slice().reverse().map(s=>`
    <div class="sale-row">
      <div class="sale-top"><span>${esc(s.brand||'')} ${esc(s.name||'')}</span><span>${money(Number(s.price||0)*Number(s.qty||1))}</span></div>
      <div class="sale-sub">${esc(s.date||'')} ・ ${s.sku ? '序號 '+esc(s.sku)+' ・ ' : ''}尺寸 ${esc(s.size||'-')} ・ ${Number(s.qty||1)} 件</div>
    </div>`).join('');
}
function recordSale(p,size,qty=1){
  sales.push({
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    date:new Date().toISOString().slice(0,10),
    sku:p.sku||'',
    brand:p.brand||'',
    name:p.name||'',
    size,
    qty,
    price:Number(p.price||0),
    cost:Number(p.cost||0)
  });
  localStorage.setItem(SALES_KEY,JSON.stringify(sales));
}

function changeSizeQty(id, delta){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  const sizes = Object.keys(p.sizes||{});
  if(!sizes.length) return alert('請先編輯商品並選擇尺寸');
  const msg = '請輸入尺寸：\\n' + sizes.map(s=>`${s}（${Number(p.sizes[s]||0)}件）`).join('、');
  const size = (prompt(msg)||'').trim().toUpperCase();
  if(!size) return;
  if(p.sizes[size] === undefined) return alert('沒有這個尺寸');
  if(delta < 0 && Number(p.sizes[size])<=0) return alert(size+' 尺寸目前沒有庫存');
  p.sizes[size] = Math.max(0,Number(p.sizes[size]||0)+delta);
  if(delta < 0) recordSale(p,size,1);
  recalcQty(p);
  persist();
}

function changeQty(id, delta){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  if(delta < 0 && Number(p.qty)<=0) return alert('這個商品目前沒有庫存');
  p.qty = Math.max(0, Number(p.qty||0)+delta);
  if(delta < 0) recordSale(p,'-',1);
  persist();
}

function openModal(id=null){
  editingId = id;
  const p = id ? products.find(x=>x.id===id) : null;
  $('modalTitle').textContent = p ? '編輯商品' : '新增商品';
  $('sku').value = p?.sku || '';
  $('brand').value = p?.brand || '';
  $('productName').value = p?.name || '';
  currentProductType = p?.productType || ((p?.sizes && Object.keys(p.sizes).some(s=>SIZE_OPTIONS.shoes.includes(s))) ? 'shoes' : 'clothes');
  $('productType').value = currentProductType;
  selectedSizes = p?.sizes ? {...p.sizes} : (p?.size ? {[p.size]:Number(p.qty||0)} : {});
  renderSizeEditor();
  selectedColors = p?.colors ? [...p.colors] : (p?.color ? [p.color] : []);
  renderColors();
  $('cost').value = p?.cost ?? '';
  $('price').value = p?.price ?? '';
  $('deleteBtn').style.display = p ? 'block' : 'none';
  $('modal').classList.add('show');
}
function closeModal(){
  $('modal').classList.remove('show');
  editingId = null;
}
function backdropClose(e){
  if(e.target.id==='modal') closeModal();
}
function saveProduct(){
  const name = $('productName').value.trim();
  if(!name) return alert('請輸入商品名稱');
  if(!Object.keys(selectedSizes).length) return alert('請至少選擇一個尺寸');
  if(!selectedColors.length) return alert('請至少選擇一個顏色');
  const data = {
    productType:currentProductType,
    sku:$('sku').value.trim(),
    brand:$('brand').value.trim(),
    name,
    sizes:{...selectedSizes},
    colors:[...selectedColors],
    cost:Math.max(0,Number($('cost').value||0)),
    price:Math.max(0,Number($('price').value||0)),
    qty:Object.values(selectedSizes).reduce((a,n)=>a+Number(n||0),0)
  };
  if(editingId){
    const i = products.findIndex(x=>x.id===editingId);
    if(i>=0) products[i] = {...products[i],...data};
  }else{
    products.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),...data});
  }
  closeModal();
  persist();
}
function deleteProduct(){
  if(!editingId) return;
  if(!confirm('確定要刪除這個商品嗎？')) return;
  products = products.filter(x=>x.id!==editingId);
  closeModal();
  persist();
}

const now = new Date();
$('monthPicker').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
$('search').addEventListener('input',render);
$('brandFilter').addEventListener('change',render);
render();
</script>
</body>
</html>
