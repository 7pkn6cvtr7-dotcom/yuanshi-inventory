<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>猿始服飾｜雲端庫存</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding-bottom:100px}
header{background:#111;color:#fff;padding:calc(22px + env(safe-area-inset-top)) 18px 20px}
.wrap{max-width:850px;margin:auto;padding:15px}
h1{font-size:24px;margin:0 0 5px}.sub{font-size:13px;color:#bbb}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.user{font-size:12px;color:#ccc;overflow:hidden;text-overflow:ellipsis}
.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:700;font-size:14px;cursor:pointer}
.dark{background:#111;color:#fff}.light{background:#eee;color:#111}.danger{background:#fff0f0;color:#c33}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat,.card,.panel,.authbox{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px #00000008}
.stat small,.muted{color:#777;font-size:12px}.stat strong{display:block;margin-top:4px;font-size:18px}
.panel{margin-bottom:12px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.grid4 div{background:#f6f6f6;border-radius:11px;padding:10px}.grid4 small{display:block;color:#777;font-size:11px}.grid4 strong{font-size:15px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0 0}
.tab{border:0;border-radius:10px;padding:11px;font-weight:800;background:#eee}.tab.on{background:#111;color:#fff}
.tools{display:flex;gap:8px;margin-bottom:12px}.input,.select{width:100%;border:1px solid #ddd;border-radius:11px;padding:12px;font-size:16px;background:#fff}
.card{margin-bottom:10px}.top{display:flex;justify-content:space-between;gap:10px}.brand{display:inline-block;background:#eee;border-radius:999px;padding:4px 8px;font-size:11px}
.name{font-weight:800;font-size:18px;margin:7px 0}.meta{font-size:13px;color:#666;line-height:1.7}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:#f1f1f1;border-radius:8px;padding:5px 7px;font-size:12px}.qty{text-align:right}.qty strong{display:block;font-size:27px}
.actions{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin-top:12px;padding-top:12px;border-top:1px solid #eee}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:8;border:0;border-radius:999px;background:#111;color:#fff;padding:15px 19px;font-weight:800;box-shadow:0 6px 22px #0004}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end;justify-content:center}.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:620px;border-radius:22px 22px 0 0;padding:19px;max-height:93vh;overflow:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:800;margin:0 0 5px}.field{margin-bottom:10px}
.pick{display:flex;flex-wrap:wrap;gap:6px}.pick button{border:1px solid #ddd;background:#f2f2f2;border-radius:9px;padding:9px 11px}.pick button.on{background:#111;color:#fff;border-color:#111}
.variant{display:grid;grid-template-columns:95px 1fr;gap:8px;align-items:center;margin:6px 0}.variant input{border:1px solid #ddd;border-radius:9px;padding:9px;width:100%}
.sheetactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.authwrap{min-height:70vh;display:grid;place-items:center}.authbox{width:100%;max-width:430px}.authbox h2{margin-top:0}
.authbox .input{margin-bottom:9px}.authactions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none!important}.empty{text-align:center;background:#fff;border-radius:16px;padding:40px;color:#888}
.log{font-size:12px;padding:10px 0;border-bottom:1px solid #eee;line-height:1.6}
.logactions{display:flex;gap:6px;margin-top:7px}
.logactions button{border:0;border-radius:8px;padding:7px 10px;font-weight:700;font-size:12px}
.editSale{background:#eee;color:#111}.cancelSale{background:#fff0f0;color:#c33}.status{font-size:12px;margin-top:8px;color:#666}
.specgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.spec{border:1px solid #ddd;background:#fff;border-radius:13px;padding:12px;text-align:left}.spec.on{border:2px solid #111;background:#f5f5f5}.spec.soldout{opacity:.4}
.spec b{display:block;font-size:15px}.spec span{font-size:12px;color:#777}.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center;margin:14px 0}
.stepper button{height:48px;border:0;border-radius:12px;background:#eee;font-size:24px}.stepper input{text-align:center;height:48px;border:1px solid #ddd;border-radius:12px;font-size:20px;font-weight:800;width:100%}
.summarybox{background:#f5f5f5;border-radius:13px;padding:12px;font-size:13px;line-height:1.7}
.paypick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.paybtn{border:1px solid #ddd;background:#fff;border-radius:12px;padding:13px 8px;font-weight:800}
.paybtn.on{background:#111;color:#fff;border-color:#111}
.paystats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.paystats div{background:#f6f6f6;border-radius:11px;padding:10px}
.paystats small{display:block;color:#777;font-size:11px}
.paystats strong{font-size:14px}
.mainnav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mainnav button{border:0;border-radius:13px;padding:13px;font-weight:800;font-size:15px;background:#e9e9e9;color:#111}
.mainnav button.on{background:#111;color:#fff}
.inventoryTop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.invTableWrap{background:#fff;border-radius:16px;overflow:auto;box-shadow:0 2px 10px #00000008}
.invTable{width:100%;border-collapse:collapse;min-width:620px}
.invTable th,.invTable td{padding:12px 10px;border-bottom:1px solid #eee;text-align:left;font-size:13px;vertical-align:middle}
.invTable th{background:#f7f7f7;position:sticky;top:0;z-index:1;font-size:12px}
.invTable .num{text-align:right;font-weight:800}
.invTable .low{font-weight:900}
.invProduct{font-weight:800}
.invSku{font-size:11px;color:#888;margin-top:3px}
.invGroup td{background:#fafafa;font-weight:800}
@media(max-width:560px){.inventoryTop{grid-template-columns:1fr 1fr}.inventoryTop .stat:last-child{grid-column:1/-1}}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.grid4{grid-template-columns:1fr 1fr}.tools{flex-direction:column}.grid{grid-template-columns:1fr}.full{grid-column:auto}.specgrid{grid-template-columns:1fr 1fr}}

.shopHero{background:#111;color:#fff;border-radius:18px;padding:24px 18px;margin-bottom:12px}
.shopHero h2{font-size:28px;margin:0 0 5px}.shopHero p{margin:0;color:#bbb;font-size:13px}
.shopGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.shopCard{background:#fff;border-radius:17px;overflow:hidden;box-shadow:0 2px 10px #0000000a}
.shopImg{width:100%;aspect-ratio:1/1;object-fit:cover;background:#eee;display:block}
.shopNoImg{aspect-ratio:1/1;background:#eee;display:grid;place-items:center;color:#999;font-size:13px}
.shopBody{padding:13px}.shopBrand{font-size:11px;color:#777}.shopName{font-weight:800;font-size:16px;margin:4px 0 6px}
.shopPrice{font-size:19px;font-weight:900;margin-bottom:8px}.shopSpecs{display:flex;flex-wrap:wrap;gap:5px}
.shopSpec{font-size:11px;background:#f2f2f2;border-radius:7px;padding:5px 7px}.shopSold{opacity:.45;text-decoration:line-through}
.shopSearch{margin-bottom:12px}
.imagePreview{width:120px;height:120px;object-fit:cover;border-radius:12px;background:#eee;margin-top:8px;display:none}
@media(max-width:560px){.mainnav{grid-template-columns:1fr!important}.shopGrid{grid-template-columns:1fr 1fr}.shopBody{padding:10px}.shopName{font-size:14px}.shopPrice{font-size:17px}}
</style>
</head>
<body>
<header><div style="max-width:850px;margin:auto">
<h1>猿始服飾｜庫存管理</h1><div class="sub">Firebase 雲端同步版</div>
<div id="userBar" class="bar hidden"><div id="userEmail" class="user"></div><button class="btn light" id="logoutBtn">登出</button></div>
</div></header>

<main class="wrap">
<section id="authView" class="authwrap"><div class="authbox">
<h2>老闆登入</h2>
<input id="email" class="input" type="email" placeholder="Email">
<input id="password" class="input" type="password" placeholder="密碼（至少 6 碼）">
<div class="authactions"><button class="btn dark" id="loginBtn">登入</button><button class="btn light" id="registerBtn">註冊</button></div>
<div id="authStatus" class="status">登入後即可讀取共用庫存。</div>
</div></section>

<section id="appView" class="hidden">
<div class="mainnav" style="grid-template-columns:1fr 1fr 1fr">
<button id="manageViewBtn" class="on">商品管理</button>
<button id="inventoryViewBtn">📦 庫存總表</button>
<button id="shopViewBtn">🛍️ 客人官網</button>
</div>

<div id="manageView">
<div class="stats">
<div class="stat"><small>庫存總件數</small><strong id="totalQty">0</strong></div>
<div class="stat"><small>庫存總成本</small><strong id="totalCost">$0</strong></div>
<div class="stat"><small>庫存售價總值</small><strong id="totalRetail">$0</strong></div>
</div>

<div class="panel">
<div class="panelhead"><div><small class="muted">營運統計</small><h3 id="monthTitle" style="margin:2px 0">本月統計</h3></div><input id="monthPicker" class="select" type="month" style="width:auto"></div>
<div class="tabs"><button id="salesTab" class="tab on">銷售統計</button><button id="stockTab" class="tab">進貨統計</button></div>

<div id="salesStats">
<div class="grid4">
<div><small>售出</small><strong id="monthUnits">0 件</strong></div>
<div><small>營業額</small><strong id="monthRevenue">$0</strong></div>
<div><small>商品成本</small><strong id="monthCost">$0</strong></div>
<div><small>毛利</small><strong id="monthProfit">$0</strong></div>
</div>
<div class="paystats">
<div><small>現金</small><strong id="payCash">$0</strong></div>
<div><small>轉帳</small><strong id="payTransfer">$0</strong></div>
<div><small>蝦皮</small><strong id="payShopee">$0</strong></div>
<div><small>貨到付款</small><strong id="payCod">$0</strong></div>
</div>
<details style="margin-top:10px" open><summary>銷售明細</summary><div id="salesList"></div></details>
</div>

<div id="stockStats" class="hidden">
<div class="grid4">
<div><small>進貨</small><strong id="stockUnits">0 件</strong></div>
<div><small>進貨總成本</small><strong id="stockCost">$0</strong></div>
<div><small>進貨筆數</small><strong id="stockCount">0 筆</strong></div>
<div><small>平均單件成本</small><strong id="stockAvg">$0</strong></div>
</div>
<details style="margin-top:10px" open><summary>進貨明細</summary><div id="stockList"></div></details>
</div>
</div>

<div class="tools"><input id="search" class="input" placeholder="搜尋品牌、商品、序號、尺寸、顏色"><select id="brandFilter" class="select"><option value="">全部品牌</option></select></div>
<section id="list"></section>
</div>

<div id="inventoryView" class="hidden">
<div class="inventoryTop">
<div class="stat"><small>庫存總件數</small><strong id="invTotalQty">0</strong></div>
<div class="stat"><small>庫存總成本</small><strong id="invTotalCost">$0</strong></div>
<div class="stat"><small>商品款數</small><strong id="invProductCount">0</strong></div>
</div>

<div class="tools">
<input id="invSearch" class="input" placeholder="搜尋商品、品牌、序號、顏色、尺寸">
<select id="invBrandFilter" class="select"><option value="">全部品牌</option></select>
<select id="invStockFilter" class="select">
<option value="">全部庫存</option>
<option value="in">只看有庫存</option>
<option value="low">只看低庫存（1件）</option>
<option value="zero">只看缺貨</option>
</select>
</div>

<div class="invTableWrap">
<table class="invTable">
<thead><tr><th>品牌 / 商品</th><th>序號</th><th>顏色</th><th>尺寸</th><th class="num">庫存</th><th class="num">成本</th><th class="num">售價</th></tr></thead>
<tbody id="inventoryBody"></tbody>
</table>
</div>
</div>

<div id="shopView" class="hidden">
<div class="shopHero">
<h2>猿始服飾</h2>
<p>現貨商品・庫存即時更新</p>
</div>
<input id="shopSearch" class="input shopSearch" placeholder="搜尋品牌、商品、尺寸、顏色">
<div id="shopGrid" class="shopGrid"></div>
</div>
</section>
</main>

<button id="fab" class="fab hidden">＋ 新增商品</button>

<!-- 新增/編輯商品 -->
<div id="modal" class="modal"><div class="sheet">
<h2 id="modalTitle">新增商品</h2>
<div class="grid">
<div class="field"><label>商品序號</label><input id="sku" class="input"></div>
<div class="field"><label>品牌</label><select id="brand" class="select"><option value="">請選擇品牌</option><option value="AAPE">AAPE</option><option value="迪桑特">迪桑特</option><option value="ON">ON</option><option value="BAPE">BAPE</option></select></div>
<div class="field full"><label>商品名稱</label><input id="productName" class="input"></div>
<div class="field full">
<label>商品圖片</label>
<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" class="input">
<input id="imageUrl" type="hidden">
<div id="imageUploadStatus" class="muted" style="margin-top:7px">從相簿選照片，預覽出現後請按「儲存」。</div>
<img id="imagePreview" class="imagePreview" alt="商品圖片預覽">
</div>
<div class="field full"><label>商品類型</label><select id="productType" class="select"><option value="clothes">衣服</option><option value="shoes">鞋子</option></select></div>
<div class="field full"><label>尺寸（可複選）</label><div id="sizePick" class="pick"></div></div>
<div class="field full"><label>顏色（可複選）</label><div id="colorPick" class="pick"></div><div style="display:flex;gap:6px;margin-top:7px"><input id="customColor" class="input" placeholder="其他顏色"><button id="addColorBtn" class="btn light">加入</button></div></div>
<div class="field full"><label>顏色 × 尺寸庫存</label><div id="variants"></div></div>
<div class="field"><label>進貨成本</label><input id="cost" class="input" type="number" min="0"></div>
<div class="field"><label>售價</label><input id="price" class="input" type="number" min="0"></div>
</div>
<div class="sheetactions"><button id="cancelBtn" class="btn light">取消</button><button id="saveBtn" class="btn dark">儲存</button></div>
<button id="deleteBtn" class="btn danger hidden" style="width:100%;margin-top:8px">刪除商品</button>
</div></div>

<!-- 快速售出/進貨 -->
<div id="quickModal" class="modal"><div class="sheet">
<h2 id="quickTitle">快速售出</h2>
<div id="quickProduct" class="muted"></div>
<div id="quickSpecs" class="specgrid"></div>
<div id="quickSelected" class="summarybox">請先選擇規格</div>
<div id="paymentArea">
<label style="margin-top:14px">付款方式</label>
<div class="paypick">
<button type="button" class="paybtn" data-pay="現金">現金</button>
<button type="button" class="paybtn" data-pay="轉帳">轉帳</button>
<button type="button" class="paybtn" data-pay="蝦皮">蝦皮</button>
<button type="button" class="paybtn" data-pay="貨到付款">貨到付款</button>
</div>
</div>
<div class="stepper"><button id="minusQty">−</button><input id="quickQty" type="number" min="1" value="1"><button id="plusQty">＋</button></div>
<div id="quickMoney" class="summarybox"></div>
<div class="sheetactions"><button id="quickCancel" class="btn light">取消</button><button id="quickConfirm" class="btn dark">確認</button></div>
</div></div>


<!-- 修改銷售 -->
<div id="saleEditModal" class="modal"><div class="sheet">
<h2>修改銷售紀錄</h2>
<div id="saleEditProduct" class="muted"></div>

<div class="field" style="margin-top:14px">
<label>規格</label>
<select id="saleEditVariant" class="select"></select>
</div>

<div class="field">
<label>售出數量</label>
<input id="saleEditQty" class="input" type="number" min="1">
</div>

<div class="field">
<label>成交單價</label>
<input id="saleEditPrice" class="input" type="number" min="0">
</div>

<div class="field">
<label>付款方式</label>
<select id="saleEditPayment" class="select">
<option value="現金">現金</option>
<option value="轉帳">轉帳</option>
<option value="蝦皮">蝦皮</option>
<option value="貨到付款">貨到付款</option>
</select>
</div>

<div id="saleEditInfo" class="summarybox"></div>
<div class="sheetactions">
<button id="saleEditClose" class="btn light">取消</button>
<button id="saleEditSave" class="btn dark">儲存修改</button>
</div>
<button id="saleDelete" class="btn danger" style="width:100%;margin-top:8px">取消這筆售出並加回庫存</button>
</div></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import {getFirestore,collection,doc,setDoc,deleteDoc,addDoc,onSnapshot,query,orderBy,serverTimestamp,runTransaction} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

const firebaseConfig={
apiKey:'AIzaSyDDHmYF9LNDBSW_aSq91QTYU7_rQNPkU-c',
authDomain:'yuanshi-inventory.firebaseapp.com',
projectId:'yuanshi-inventory',
storageBucket:'yuanshi-inventory.firebasestorage.app',
messagingSenderId:'107227719678',
appId:'1:107227719678:web:aad239f88e57fb4a4d42af'
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const $=id=>document.getElementById(id);
const money=n=>'$'+Number(n||0).toLocaleString('zh-TW');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const msg=e=>(e?.code||'').replace('auth/','')||e?.message||String(e);

let products=[],sales=[],stockLogs=[],editingId=null,selectedSizes=[],selectedColors=[],variantStock={};
let unsubP=null,unsubS=null,unsubL=null;
let quickProduct=null,quickAct=null,quickKey=null,quickPayment='',editingSale=null;

const sizes={clothes:['XS','S','M','L','XL','2XL'],shoes:['23','23.5','24','24.5','25','25.5','26','26.5','27','27.5','28','28.5','29']};
const baseColors=['黑','白','灰','藍','紅','綠','米','卡其'];

$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('authStatus').textContent='登入成功'}catch(e){$('authStatus').textContent='登入失敗：'+msg(e)}};
$('registerBtn').onclick=async()=>{if(!confirm('確定要用這組 Email 註冊新老闆帳號？'))return;try{await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('authStatus').textContent='註冊成功'}catch(e){$('authStatus').textContent='註冊失敗：'+msg(e)}};
$('logoutBtn').onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
if(unsubP)unsubP();if(unsubS)unsubS();if(unsubL)unsubL();
if(user){
$('authView').classList.add('hidden');$('appView').classList.remove('hidden');$('fab').classList.remove('hidden');$('userBar').classList.remove('hidden');$('userEmail').textContent=user.email;
unsubP=onSnapshot(collection(db,'products'),s=>{products=s.docs.map(d=>({id:d.id,...d.data()}));render()});
unsubS=onSnapshot(query(collection(db,'sales'),orderBy('createdAt','asc')),s=>{sales=s.docs.map(d=>({id:d.id,...d.data()}));renderStats()});
unsubL=onSnapshot(query(collection(db,'stockLogs'),orderBy('createdAt','asc')),s=>{stockLogs=s.docs.map(d=>({id:d.id,...d.data()}));renderStats()});
}else{
$('authView').classList.remove('hidden');$('appView').classList.add('hidden');$('fab').classList.add('hidden');$('userBar').classList.add('hidden');products=[];sales=[];stockLogs=[];
}});

function render(){
let q=$('search').value.trim().toLowerCase(),bf=$('brandFilter').value;
let brands=[...new Set(products.map(p=>p.brand).filter(Boolean))].sort();
$('brandFilter').innerHTML='<option value="">全部品牌</option>'+brands.map(b=>`<option>${esc(b)}</option>`).join('');
if(brands.includes(bf))$('brandFilter').value=bf;
let rows=products.filter(p=>{
let t=[p.sku,p.brand,p.name,...(p.colors||[]),...Object.keys(p.variantStock||{})].join(' ').toLowerCase();
return(!q||t.includes(q))&&(!bf||p.brand===bf);

};

function updateImagePreview(){

async function uploadProductImage(file){
if(!file||imageProcessing)return;
const status=$('imageUploadStatus');
imageProcessing=true;
$('imageFile').disabled=true;
$('saveBtn').disabled=true;
$('cancelBtn').disabled=true;
let objectUrl;
try{
status.textContent='正在處理照片，請稍候…';
objectUrl=URL.createObjectURL(file);
const img=new Image();
await new Promise((resolve,reject)=>{
img.onload=resolve;
img.onerror=()=>reject(new Error('無法讀取這張照片，請改選 JPG、PNG 或照片截圖。'));
img.src=objectUrl;
});
const canvas=document.createElement('canvas');
const scale=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight));
canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
const ctx=canvas.getContext('2d');
ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.drawImage(img,0,0,canvas.width,canvas.height);
let result;
for(const quality of [0.85,0.7,0.55,0.4,0.25]){
result=canvas.toDataURL('image/jpeg',quality);
if(result.length<=280000)break;
}
if(result.length>280000){
const small=document.createElement('canvas');
small.width=Math.max(1,Math.round(canvas.width*0.5));
small.height=Math.max(1,Math.round(canvas.height*0.5));
small.getContext('2d').drawImage(canvas,0,0,small.width,small.height);
result=small.toDataURL('image/jpeg',0.6);
}
if(result.length>280000)throw new Error('照片內容太大，請裁切後再選。');
$('imageUrl').value=result;
updateImagePreview();
status.textContent='照片已準備好，請按「儲存」完成更新。';
}catch(e){
status.textContent='圖片處理失敗：'+e.message;
}finally{
if(objectUrl)URL.revokeObjectURL(objectUrl);
imageProcessing=false;
$('imageFile').disabled=false;
$('saveBtn').disabled=false;
$('cancelBtn').disabled=false;
$('imageFile').value='';
}
}

$('colorPick').innerHTML=cs.map(c=>`<button class="${selectedColors.includes(c)?'on':''}" data-color="${esc(c)}">${esc(c)}</button>`).join('');
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{let s=b.dataset.size;selectedSizes=selectedSizes.includes(s)?selectedSizes.filter(x=>x!==s):[...selectedSizes,s];renderPicks()});
document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{let c=b.dataset.color;selectedColors=selectedColors.includes(c)?selectedColors.filter(x=>x!==c):[...selectedColors,c];renderPicks()});
renderVariants();
}
function renderVariants(){
$('variants').innerHTML=selectedColors.length&&selectedSizes.length?selectedColors.flatMap(c=>selectedSizes.map(s=>{let k=c+'||'+s;return `<div class="variant"><b>${esc(c)} ${esc(s)}</b><input type="number" min="0" value="${Number(variantStock[k]||0)}" data-v="${esc(k)}"></div>`})).join(''):'<div class="muted">先選顏色與尺寸</div>';
document.querySelectorAll('[data-v]').forEach(i=>i.oninput=()=>variantStock[i.dataset.v]=Math.max(0,Number(i.value||0)));
}
$('productType').onchange=()=>{selectedSizes=[];variantStock={};renderPicks()};
$('addColorBtn').onclick=()=>{let c=$('customColor').value.trim();if(c&&!selectedColors.includes(c))selectedColors.push(c);$('customColor').value='';renderPicks()};
$('fab').onclick=()=>openModal();$('cancelBtn').onclick=()=>{if(!imageProcessing)$('modal').classList.remove('show')};$('modal').onclick=e=>{if(!imageProcessing&&e.target===$('modal'))$('modal').classList.remove('show')};

$('saveBtn').onclick=async()=>{
if(imageProcessing)return alert('照片處理中，請稍候');
let name=$('productName').value.trim(),brand=$('brand').value;if(!brand)return alert('請選擇品牌');if(!name||!selectedSizes.length||!selectedColors.length)return alert('請填商品名稱並選尺寸、顏色');
let clean={};selectedColors.forEach(c=>selectedSizes.forEach(s=>clean[c+'||'+s]=Number(variantStock[c+'||'+s]||0)));
let data={sku:$('sku').value.trim(),brand,name,imageUrl:$('imageUrl').value.trim(),productType:$('productType').value,colors:selectedColors,variantStock:clean,qty:Object.values(clean).reduce((a,n)=>a+n,0),cost:Math.max(0,Number($('cost').value||0)),price:Math.max(0,Number($('price').value||0)),updatedAt:serverTimestamp(),updatedBy:auth.currentUser.email};
try{
if(editingId)await setDoc(doc(db,'products',editingId),data,{merge:true});
else await addDoc(collection(db,'products'),{...data,createdAt:serverTimestamp(),createdBy:auth.currentUser.email});
$('modal').classList.remove('show');
}catch(e){alert(e.message)}
};
$('deleteBtn').onclick=async()=>{if(editingId&&confirm('確定刪除這個商品？')){await deleteDoc(doc(db,'products',editingId));$('modal').classList.remove('show')}};
$('search').oninput=render;$('brandFilter').onchange=render;$('monthPicker').onchange=renderStats;
let now=new Date();$('monthPicker').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
</script>
</body>
</html>
